    API1461_request:
      title: API#1461 Cease PSA or PSP from the Scheme Request Schema
      type: object
      oneOf:
        - description: Request to Cease PSA, initiated by PSA
          type: object
          properties:
            ceaseIDType:
              type: string
              enum:
                - PSAID
            ceaseNumber:
              type: string
              description: Cease Number
              pattern: ^A[0-9]{7}$
            initiatedIDType:
              type: string
              enum:
                - PSAID
            initiatedIDNumber:
              type: string
              description: InitiatedID Number
              pattern: ^A[0-9]{7}$
            ceaseDate:
              type: string
              pattern: ^(((19|20)([2468][048]|[13579][26]|0[48])|2000)[-]02[-]29|((19|20)[0-9]{2}[-](0[469]|11)[-](0[1-9]|1[0-9]|2[0-9]|30)|(19|20)[0-9]{2}[-](0[13578]|1[02])[-](0[1-9]|[12][0-9]|3[01])|(19|20)[0-9]{2}[-]02[-](0[1-9]|1[0-9]|2[0-8])))$
              description: Cease Date of PSA from the Scheme (CCYY-MM-DD)
          required:
            - ceaseIDType
            - ceaseNumber
            - initiatedIDType
            - initiatedIDNumber
            - ceaseDate
          additionalProperties: false
        - description: Request to Cease PSP, initiated by PSA
          type: object
          properties:
            ceaseIDType:
              type: string
              enum:
                - PSPID
            ceaseNumber:
              type: string
              description: Cease PSPID Number
              pattern: ^[0|1|2]{1}[0-9]{7}$
            initiatedIDType:
              type: string
              enum:
                - PSAID
            initiatedIDNumber:
              type: string
              description: Initiated PSAID Number
              pattern: ^A[0-9]{7}$
            ceaseDate:
              type: string
              pattern: ^(((19|20)([2468][048]|[13579][26]|0[48])|2000)[-]02[-]29|((19|20)[0-9]{2}[-](0[469]|11)[-](0[1-9]|1[0-9]|2[0-9]|30)|(19|20)[0-9]{2}[-](0[13578]|1[02])[-](0[1-9]|[12][0-9]|3[01])|(19|20)[0-9]{2}[-]02[-](0[1-9]|1[0-9]|2[0-8])))$
              description: Cease Date of PSA from the Scheme (CCYY-MM-DD)
            declarationCeasePSPDetails:
              $ref: "#/components/schemas/API1461_declarationBox1Type"
          required:
            - ceaseIDType
            - ceaseNumber
            - initiatedIDType
            - initiatedIDNumber
            - ceaseDate
            - declarationCeasePSPDetails
          additionalProperties: false
        - description: Request to Cease PSP, initiated by PSP
          type: object
          properties:
            ceaseIDType:
              type: string
              enum:
                - PSPID
            ceaseNumber:
              type: string
              description: Cease PSPID Number
              pattern: ^[0|1|2]{1}[0-9]{7}$
            initiatedIDType:
              type: string
              enum:
                - PSPID
            initiatedIDNumber:
              type: string
              description: Initiated PSPID Number
              pattern: ^[0|1|2]{1}[0-9]{7}$
            ceaseDate:
              type: string
              pattern: ^(((19|20)([2468][048]|[13579][26]|0[48])|2000)[-]02[-]29|((19|20)[0-9]{2}[-](0[469]|11)[-](0[1-9]|1[0-9]|2[0-9]|30)|(19|20)[0-9]{2}[-](0[13578]|1[02])[-](0[1-9]|[12][0-9]|3[01])|(19|20)[0-9]{2}[-]02[-](0[1-9]|1[0-9]|2[0-8])))$
              description: Cease Date of PSA from the Scheme (CCYY-MM-DD)
            declarationCeasePSPDetails:
              $ref: "#/components/schemas/API1461_declarationBox2Type"
          required:
            - ceaseIDType
            - ceaseNumber
            - initiatedIDType
            - initiatedIDNumber
            - ceaseDate
            - declarationCeasePSPDetails
          additionalProperties: false
    API1461_declarationBox1Type:
      description: This object is applicable and mandatory if CeaseID type is PSPID
      type: object
      properties:
        declarationBox1:
          description: This declarationBox1 is applicable and mandatory if the InitiatedID
            Type is PSAID
          type: boolean
      required:
        - declarationBox1
      additionalProperties: false
    API1461_declarationBox2Type:
      description: This object is applicable and mandatory if CeaseID type is PSPID
      type: object
      properties:
        declarationBox2:
          description: This declarationBox2Type is applicable and mandatory if the
            InitiatedID Type is PSPID
          type: boolean
      required:
        - declarationBox2
      additionalProperties: false
    API1461_successResponse:
      title: API#1461 Cease PSA or PSP from the Scheme Success Response Schema
      type: object
      additionalProperties: false
      required:
        - processingDate
      properties:
        processingDate:
          type: string
          description: The date the message was processed
          format: date-time
    API1461_ceaseScheme_SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          $ref: "#/components/schemas/API1461_successResponse"
    API1468_request:
      title: API#1468 Scheme Variation Details Request Schema
      type: object
      additionalProperties: false
      required:
        - schemeDetails
        - pensionSchemeDeclaration
        - establisherAndTrustDetailsType
      properties:
        schemeDetails:
          type: object
          properties:
            changeOfschemeDetails:
              type: boolean
              description: true = TCMP benefit Type is amended, false =  TCMP benefit Type is
                NOT amended or Not Applicable
            psaid:
              type: string
              description: Pension Scheme Administrator Id.
              pattern: ^A[0-9]{7}$
            schemeStatus:
              type: string
              enum:
                - Open
            schemeName:
              $ref: "#/components/schemas/API1468_specialCharStringType"
            isSchemeMasterTrust:
              type: boolean
              description: true for Yes, false for No
            pensionSchemeStructure:
              type: string
              description: type and structure of the scheme
              enum:
                - A single trust under which all of the assets are held for the
                  benefit of all members of the scheme
                - A group life/death in service scheme
                - A body corporate
                - Other
            otherPensionSchemeStructure:
              $ref: "#/components/schemas/API1468_specialCharStringType"
            currentSchemeMembers:
              type: string
              enum:
                - "0"
                - "1"
                - 2 to 11
                - 12 to 50
                - 51 to 10,000
                - More than 10,000
            futureSchemeMembers:
              type: string
              enum:
                - "0"
                - "1"
                - 2 to 11
                - 12 to 50
                - 51 to 10,000
                - More than 10,000
            isRegulatedSchemeInvestment:
              type: boolean
              description: true for Yes, false for No
            isOccupationalPensionScheme:
              type: boolean
              description: true for Yes, false for No
            schemeProvideBenefits:
              type: string
              description: 01-Money Purchase benefits only (defined contribution), 02-Defined
                Benefits only, 03-Mixture of money purchase benefits and defined
                benefits
              enum:
                - Money Purchase benefits only (defined contribution)
                - Defined Benefits only
                - Mixture of money purchase benefits and defined benefits
            tcmpBenefitType:
              type: string
              description: "Mandatory, If schemeProvideBenefits field value is either Money
                Purchase benefits only (defined contribution) or Defined
                Benefits only. 01 - Collective money purchase benefits, 02- Cash
                balance benefits, 03 -Other money purchase benefits, 04 -
                Mixture of Collective money purchase benefits and cash balance
                and/or other money purchase benefits, 05 - Mixture of Cash
                balance benefits and other money purchase benefits "
              enum:
                - "01"
                - "02"
                - "03"
                - "04"
                - "05"
            schemeEstablishedCountry:
              $ref: "#/components/schemas/API1468_countryCodes"
            insuranceCompanyDetails:
              $ref: "#/components/schemas/API1468_insuranceCompanyDetailsType"
          additionalProperties: false
          required:
            - changeOfschemeDetails
            - psaid
            - schemeStatus
            - schemeName
            - isSchemeMasterTrust
            - currentSchemeMembers
            - futureSchemeMembers
            - isRegulatedSchemeInvestment
            - isOccupationalPensionScheme
            - schemeProvideBenefits
            - schemeEstablishedCountry
            - insuranceCompanyDetails
        pensionSchemeDeclaration:
          $ref: "#/components/schemas/API1468_pensionSchemeDeclarationType"
        establisherAndTrustDetailsType:
          $ref: "#/components/schemas/API1468_establisherAndTrustDetailsType"
    API1468_insuranceCompanyDetailsType:
      type: object
      properties:
        isInsuranceDetailsChanged:
          description: true for Changes updated, false for No changes made
          type: boolean
        isSchemeBenefitsInsuranceCompany:
          type: boolean
          description: true for Yes, false for No
        insuranceCompanyName:
          $ref: "#/components/schemas/API1468_specialCharStringType"
        policyNumber:
          type: string
          pattern: ^[a-zA-Z0-9À-ÿ !#$%&'‘’"“”«»()*+,./:;=?@\[\]|~£€¥\u005C—–‐_^`-]{1,55}$
        insuranceCompanyAddressDetails:
          $ref: "#/components/schemas/API1468_addressType"
      additionalProperties: false
      required:
        - isInsuranceDetailsChanged
        - isSchemeBenefitsInsuranceCompany
    API1468_pensionSchemeDeclarationType:
      type: object
      properties:
        declaration1:
          type: boolean
          description: "true : Selected, false: Not Selected"
      additionalProperties: false
      required:
        - declaration1
    API1468_establisherAndTrustDetailsType:
      type: object
      properties:
        changeOfEstablisherOrTrustDetails:
          description: true for Changes updated, false for No changes made
          type: boolean
        haveMoreThanTenTrustees:
          type: boolean
          description: true for Yes, false for No
        establisherDetails:
          $ref: "#/components/schemas/API1468_establisherDetailsType"
        trusteeDetailsType:
          $ref: "#/components/schemas/API1468_trusteeDetailsType"
      additionalProperties: false
      required:
        - changeOfEstablisherOrTrustDetails
        - establisherDetails
    API1468_establisherDetailsType:
      type: object
      properties:
        individualDetails:
          $ref: "#/components/schemas/API1468_establisherIndividualDetailsType"
        companyOrOrganisationDetails:
          $ref: "#/components/schemas/API1468_establisherCompanyOrOrgDetailsType"
        partnershipDetails:
          $ref: "#/components/schemas/API1468_establisherPartnershipDetailsType"
      additionalProperties: false
    API1468_trusteeDetailsType:
      type: object
      description: Trustee Details should have not more than 10 Trustee (Combination
        of Individual Trustee, Company Trustee and Partnership Trustee less than
        or equal to 10)
      properties:
        individualDetails:
          $ref: "#/components/schemas/API1468_individualTrusteeDetailsType"
        companyTrusteeDetailsType:
          $ref: "#/components/schemas/API1468_companyTrusteeDetailsType"
        partnershipTrusteeDetails:
          $ref: "#/components/schemas/API1468_partnershipTrusteeDetailsType"
      additionalProperties: false
    API1468_establisherIndividualDetailsType:
      type: array
      minItems: 0
      items:
        type: object
        properties:
          personalDetails:
            type: object
            properties:
              title:
                type: string
                enum:
                  - Mr
                  - Mrs
                  - Miss
                  - Ms
                  - Dr
                  - Sir
                  - Professor
                  - Lord
              firstName:
                $ref: "#/components/schemas/API1468_nameType"
              middleName:
                $ref: "#/components/schemas/API1468_nameType"
              lastName:
                $ref: "#/components/schemas/API1468_nameType"
              dateOfBirth:
                $ref: "#/components/schemas/API1468_dateType"
            additionalProperties: false
            required:
              - firstName
              - lastName
              - dateOfBirth
          nino:
            type: string
            pattern: ^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$
          noNinoReason:
            $ref: "#/components/schemas/API1468_specialCharStringType"
          utr:
            type: string
            pattern: ^[0-9]{10}$
          noUtrReason:
            $ref: "#/components/schemas/API1468_specialCharStringType"
          correspondenceAddressDetails:
            type: object
            properties:
              addressDetails:
                $ref: "#/components/schemas/API1468_addressType"
            additionalProperties: false
            required:
              - addressDetails
          correspondenceContactDetails:
            type: object
            properties:
              contactDetails:
                $ref: "#/components/schemas/API1468_contactDetailsType"
            additionalProperties: false
            required:
              - contactDetails
          previousAddressDetails:
            type: object
            properties:
              isPreviousAddressLast12Month:
                type: boolean
              previousAddressDetails:
                $ref: "#/components/schemas/API1468_addressType"
            additionalProperties: false
            required:
              - isPreviousAddressLast12Month
        additionalProperties: false
        required:
          - personalDetails
          - correspondenceAddressDetails
          - correspondenceContactDetails
          - previousAddressDetails
    API1468_establisherCompanyOrOrgDetailsType:
      type: array
      minItems: 0
      items:
        type: object
        properties:
          organisationName:
            $ref: "#/components/schemas/API1468_specialCharStringType"
          utr:
