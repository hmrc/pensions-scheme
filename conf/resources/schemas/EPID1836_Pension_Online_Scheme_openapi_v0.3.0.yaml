openapi: "3.0.1"
info:
  title: "Pension Online Scheme"
  description: "\nThis API specification describes the data structures and operations\
    \ to support the Pension Online Scheme.\n\nThe following resource is offered\
    \ multiple API's:\n\n- **Pension Scheme Subscription**\n  \n\tThis API allows a Pension Scheme Administrator (PSA) to register a new pension scheme with HMRC. The PSA submits details about the scheme such as its name, structure, member count, and the trustees or establishers involved . \n\n\n- **List of Schemes for Pension Scheme Administrator (PSA) or Practitioner(PSP)**\n   \n\tThis API Allows retrieve a complete list of pension schemes they are associated with a digital service such as the HMRC Manage Pension Schemes service calls this endpoint with the administrator or practitioner's identifier.\n\n- **Get Scheme Details**\n \n\tA pension administrator or service provider needs to look up the full details of a registered pension scheme using either its Pension Scheme Tax Reference (PSTR) or Scheme Reference Number (SRN).  \n\n- **Pension Online Scheme**\n \n\tThis API handles three situations.Those are a PSA removing themselves from the scheme  a PSA removing a PSP or a PSP removing themselves.   \n\t\n\n- **Scheme Variation Details**\n \n\t This API Allows to update the details of a pension scheme they are responsible for and this API lets them submit changes to a scheme's core details such as its name, membership size, structure, benefit type, country of establishment, insurance arrangements, and the people who founded or run it (establishers and trustees).   \n\t\n\n- **Get PSP Scheme Details**\n  \n\t This API allowing authorised to work with, the PODS digital service retrieves the full scheme details from ETMP. This endpoint fetches scheme information for a specific combination of regime, PSP ID, and PSTR (Pension Scheme Tax Reference).  \n\t \n\t\n\n**EPID references:**\n \n- **EPID1836\
    \  - HIP OAS: Pension Online Scheme (POS)** \n\n```\n```\n  **Change Log:**\n\
    \  | Version | Date | Author | Description |\n  |---|-----|------|-----|\n  |0.1.0\
    \ | 2026-07-28 | GitHub Copilot  | OAS Scheme OAS extracted from consolidated specification \n |0.2.0\
    \ | 2026-08-24 | Srilakshmi Peddarapu \ | Added descriptions & summary for all the APIs.\n |||| Updated the title name \n |||| Updated license and Integration catelog\n |||| Updated the tags,Server URL and removed the extra tags\n |||| Included the EPID References.\n |||| Updated 422 business validation error code descriptions and examples\n |||| Added the E num for path parameters of All the API's\n |||| Updated the enums for the headers X-Originating-System and X- Transmitting-System\n |||| Defined the 400 Bad Request response in line aligning with HIP standards for all the APIs\n |||| Included correlationid headers for 401,403 and 404 error codes & Added the 404 tag for all API's\n|||| Added Request , Response schema, examples and path for code 422 in API1660.\n |||| Removed the {Regeme} from path parameters for All API's|\n|0.3.0|2026-10-23|Hima V Pramod|Corrected country code enumerations for API1359|\n||||Updated regex for policyNumber in API1444.|
    "
