components:
  parameters:
    correlationid:
      name: correlationid
      in: header
      required: true
      schema:
        type: string
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{12}$
        example: d82ebab6-7ac6-d756-5c06-82ca91bdc577
      description: "Unique alphanumeric number used for correlation purposes, generated by the originating system and conforming to 36-character UUID (formatted)."
    X-Originating-System:
      name: X-Originating-System
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        enum:
          - MDTP
        example: MDTP
      description: "System that is the originator of the message. Used to distinctly\
        \ identifies the service.Eg:MDTP"
    X-Receipt-Date:
      name: X-Receipt-Date
      in: header
      required: true
      schema:
        type: string
        format: date-time
        maxLength: 40
        example: 2026-01-01T00:00:00Z
      description: "The time the message was created by the system sending the message.\
        \ The value should follow this date-time pattern, and be represented in the\
        \ UTC time zone: yyyy-MM-ddTHH:mm:ssZ"
    X-Transmitting-System:
      name: X-Transmitting-System
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        enum:
          - HIP
        example: HIP
      description: Intermediary system that performs the transmission of the message.
    API1359_regimeType:
      in: path
      name: regime
      description: regime pods.
      required: true
      schema:
        type: string
        example : PODS
        pattern: ^pods$
    API1359_psaIdParam:
      in: path
      name: psaId
      description: Pension Scheme Administrator Id
      required: true
      schema:
        type: string
        example: A1234567
        pattern: ^A[0-9]{7}$
    API1360_regimeParam:
      in: path
      name: regime
      description: Regime. Possible values pods
      required: true
      schema:
        type: string
        enum:
          - "PODS"
        pattern: ^pods$
    API1360_idTypeParam:
      in: path
      name: idType
      description: Identification type. Possible values are psaid or pspid
      required: true
      schema:
        type: string
        example : PSAID
        pattern: ^(psaid|pspid)$
    API1360_idValueParam:
      in: path
      name: idValue
      description: idValue for the idType. psaid RegEx ^A[0-9]{7}$ Example A1234567,
        pspid RegEx ^[0-2]{1}[0-9]{7}$ Example 12345678
      required: true
      schema:
        type: string
        example: A1234567
        pattern: ^(A[0-9]{7}|[0-2]{1}[0-9]{7})$
    API1444_regimeParam:
      in: path
      name: regime
      description: Regime. Possible values pods
      required: true
      schema:
        type: string
        enum:
          - PODS
        pattern: ^pods$
    API1444_idTypeParam:
      in: path
      name: idType
      description: Identification type.possible values are Scheme Reference
        Number(srn), Pension Scheme Tax Reference (pstr)
      required: true
      schema:
        type: string
        example : PSTR
        pattern: ^(srn|pstr)$
    API1444_idValueParam:
      in: path
      name: idValue
      description: idValue for the idType. srn RegEx ^S[0-9]{10}$ Example S9999999999,
        pstr RegEx ^[0-9]{8}[A-Z]{2}$ Example 22345678RC
      required: true
      schema:
        type: string
        example : S1234567890
        pattern: ^(S[0-9]{10}|[0-9]{8}[A-Z]{2})$
    API1461_regimeType:
      in: path
      name: regime
      description: regime pods.
      required: true
      schema:
        type: string
        enum:
          - PODS
        pattern: ^pods$
    API1461_pstrParam:
      in: path
      name: pstr
      description: Pension Scheme Tax Reference
      required: true
      schema:
        type: string
        example : 12345678AB
        pattern: ^[0-9]{8}[A-Z]{2}$
    API1468_regimeType:
      in: path
      name: regime
      description: regime pods.
      required: true
      schema:
        type: string
        enum:
          - PODS
        pattern: ^pods$
    API1468_pstrParam:
      in: path
      name: pstr
      description: Pension Scheme Tax reference number
      required: true
      schema:
        type: string
        example : 12345678BC
        pattern: ^[0-9]{8}[A-Z]{2}$
    API1660_regimeParam:
      in: path
      name: regime
      description: Regime. Possible values pods
      required: true
      schema:
        type: string
        enum:
          - PODS
        pattern: ^pods$
    API1660_pspIdParam:
      in: path
      name: pspId
      description: Pension Scheme Practitioner Id.
      required: true
      schema:
        type: string
        example : 01234567
        pattern: ^[0|1|2]{1}[0-9]{7}$
    API1660_pstrParam:
      in: path
      name: pstr
      description: Pension Scheme Tax Reference
      required: true
      schema:
        type: string
        example : 12345678AB
        pattern: ^[0-9]{8}[A-Z]{2}$
  headers:
    correlationid:
      description: "Unique alphanumeric number used for correlation purposes, generated by the originating system and conforming to 36-character UUID (formatted)."
      schema:
        type: string
        maxLength: 36
        pattern: ^[0-9a-fA-F-]{36}$
  schemas:
    SystemErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - logID
          properties:
            code:
              type: string
              enum:
              - '400'
              - '500'
            message:
              type: string
              description: 'Constraint details are sourced from backend artefacts.'
            logID:
              type: string
              description: 'Constraint details are sourced from backend artefacts.'
    API1359_request:
      title: API#1359 Pension Scheme Subscription Request Schema
      type: object
      properties:
        schemeMigrationDetails:
          required:
            - pstrOrTpssId
            - registrationStartDate
            - psaRelationshipStartDate
          type: object
          properties:
