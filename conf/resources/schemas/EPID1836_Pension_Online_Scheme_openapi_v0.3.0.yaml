            data element not provided
          properties:
            schemeName:
              $ref: "#/components/schemas/API1359_orgOrReasonType"
            isSchemeMasterTrust:
              type: boolean
              description: true for yes, false for No
            schemeStructure:
              type: string
              description: type and structure of the scheme
