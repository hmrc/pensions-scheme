          type: object
          description: This node is mandatory , if RACDACScheme = true
          properties:
            racdacName:
              $ref: "#/components/schemas/API1359_orgOrReasonType"
            contractOrPolicyNumber:
              type: string
              description: Contract or Policy Number
              pattern: ^[a-zA-Z0-9À-ÿ!#$%&'‘’"“”«»()*+,./:;=?@\[\]|~£€¥\u005C—–‐_^`-]{1,50}$
