                - A body corporate
                - Other
            otherSchemeStructure:
              $ref: "#/components/schemas/API1359_orgOrReasonType"
            haveMoreThanTenTrustee:
              type: boolean
              description: true for yes, false for No
            currentSchemeMembers:
              type: string
              enum:
                - "0"
                - "1"
                - 2 to 11
                - 12 to 50
                - 51 to 10,000
                - More than 10,000
            futureSchemeMembers:
              type: string
              enum:
                - "0"
                - "1"
                - 2 to 11
                - 12 to 50
                - 51 to 10,000
                - More than 10,000
            isRegulatedSchemeInvestment:
              type: boolean
              description: true for yes, false for No
            isOccupationalPensionScheme:
              type: boolean
              description: true for yes, false for No
            areBenefitsSecuredContractInsuranceCompany:
              type: boolean
              description: true for yes, false for No
            doesSchemeProvideBenefits:
              type: string
              description: 01-Money Purchase benefits only (defined contribution), 02-Defined
                Benefits only, 03-Mixture of money purchase benefits and defined
                benefits
              enum:
                - Money Purchase benefits only (defined contribution)
                - Defined Benefits only
                - Mixture of money purchase benefits and defined benefits
            tcmpBenefitType:
              type: string
              description: "Mandatory, If doesSchemeProvideBenefits field value is either
                Money Purchase benefits only (defined contribution) or Defined
                Benefits only. 01 - Collective money purchase benefits, 02- Cash
                balance benefits, 03 -Other money purchase benefits, 04 -
                Mixture of Collective money purchase benefits and cash balance
                and/or other money purchase benefits, 05 - Mixture of Cash
                balance benefits and other money purchase benefits "
              enum:
                - "01"
                - "02"
                - "03"
                - "04"
                - "05"
            schemeEstablishedCountry:
              $ref: "#/components/schemas/API1359_countryCodes"
            haveInvalidBank:
              type: boolean
              description: true for yes, false for No
            insuranceCompanyName:
              $ref: "#/components/schemas/API1359_orgOrReasonType"
            policyNumber:
              type: string
              pattern: ^[a-zA-Z0-9À-ÿ!#$%&'‘’"“”«»()*+,./:;=?@\[\]|~£€¥\u005C—–‐_^`-]{1,50}$
            insuranceCompanyAddress:
              $ref: "#/components/schemas/API1359_addressType"
          additionalProperties: false
          required:
            - schemeName
            - isSchemeMasterTrust
            - currentSchemeMembers
            - futureSchemeMembers
            - isRegulatedSchemeInvestment
            - isOccupationalPensionScheme
            - doesSchemeProvideBenefits
            - schemeEstablishedCountry
            - areBenefitsSecuredContractInsuranceCompany
            - haveInvalidBank
        pensionSchemeDeclaration:
          type: object
          description: This node is mandatory, if RACDACScheme = false OR RACDACScheme
            data element not provided
          properties:
            box1:
              type: boolean
              description: "true : Selected, false: Not Selected"
            box2:
              type: boolean
              description: "true : Selected, false: Not Selected"
            box3:
              type: boolean
              description: "true : Selected, false: Not Selected. Mandatory when
                isSchemeMasterTrust field value is yes"
            box4:
              type: boolean
              description: "true : Selected, false: Not Selected. Mandatory when
