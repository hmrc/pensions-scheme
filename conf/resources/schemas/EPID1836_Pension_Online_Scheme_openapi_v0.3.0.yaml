      description: "This API retrieves List of Schemes for Pension Scheme Administrator or Practitioner Details.\n\nThe call is synchronous.\n\
        \nFor the successful scenario, the API retrieves all pension schemes associated with the specified PSA or PSP and returns the scheme portfolio details, including scheme reference numbers, statuses, and related practitioner information.\n\nFor the unsuccessful scenario, the API will return error messages.\n\
        \nEPID Reference:\n\nEPID1838"


         
