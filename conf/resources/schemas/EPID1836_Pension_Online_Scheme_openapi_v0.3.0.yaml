      tags:
        - API#1360
      parameters:
        - $ref: "#/components/parameters/correlationid"
        - $ref: "#/components/parameters/X-Originating-System"
        - $ref: "#/components/parameters/X-Receipt-Date"
        - $ref: "#/components/parameters/X-Transmitting-System"
        - $ref: "#/components/parameters/API1360_idTypeParam"
        - $ref: "#/components/parameters/API1360_idValueParam"
      responses:
        "200":
          description: Successful Response
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API1360_getSchemesForPSAPSP_SuccessResponse"
              example:
                success:
                  processingDate: 2001-12-17T09:30:47Z
                  totalSchemesRegistered: "1"
                  schemeDetails:
                    - name: abcdefghi
                      referenceNumber: S1000000456
                      schemeStatus: Pending
