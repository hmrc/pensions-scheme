    post:
      summary: API#1468 Scheme Variation Details
      description: "This particular API provides the ability to send Scheme Variation Details to backend system.\n\nThe call is synchronous.\n\
        \nFor the successful scenario, the API successfully processes the pension scheme variation request, updates the scheme information in ETMP, and returns a processing date along with a form bundle number for tracking purposes.\n\nFor the unsuccessful scenario, the API will return error messages.\n\
        \nEPID Reference:\n\nEPID1841"

          
