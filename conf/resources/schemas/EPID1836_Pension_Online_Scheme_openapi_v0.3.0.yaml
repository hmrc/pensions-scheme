  /RESTAdapter/pension-online/cease-scheme/{pstr}:
    post:
      summary: "Pension Online Scheme"
      description: "This API provides the ability to Cease(withdraw) PSA or PSP from the Scheme.\n\nThe call is synchronous.\n\
        \nFor the successful scenario, the API successfully retrieves the requested Pension Online scheme information and returns the scheme details maintained within the ETMP system..\n\nFor the unsuccessful scenario, the API will return error messages.\n\
        \nEPID Reference:\n\nEPID1840"

      
      operationId: ceaseScheme
      tags:
        - API#1461
      parameters:
        - $ref: "#/components/parameters/correlationid"
        - $ref: "#/components/parameters/X-Originating-System"
        - $ref: "#/components/parameters/X-Receipt-Date"
        - $ref: "#/components/parameters/X-Transmitting-System"
        - $ref: "#/components/parameters/API1461_pstrParam"
      responses:
        "201":
          description: Successful Response
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API1461_ceaseScheme_SuccessResponse"
              example:
                success:
                  processingDate: 2020-04-17T09:30:47Z
        "400":
          description: Bad Request
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemErrorResponse"
              example:
                error:
                  code: "400"
                  message: string
                  logID: D82EBAB67AC6D7565C0682CA91BDC577
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/API1461_ceaseScheme_422Response"
        "500":
          description: Internal Server Error
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemErrorResponse"
              examples:
                500 Error Example:
                  value:
                    error:
                      code: "500"
                      message: string
                      logID: D82EBAB67AC6D7565C0682CA91BDC577
      requestBody:
        required: true
        description: Request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/API1461_request"
            example:
              ceaseIDType: PSAID
              ceaseNumber: A1234567
              initiatedIDType: PSAID
              initiatedIDNumber: A7654321
              ceaseDate: 2019-03-29
